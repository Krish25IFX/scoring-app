apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scoring-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-server
  labels:
    app: scoring-server
  annotations:
    autoscaling.knative.dev/minScale: "1"
    autoscaling.knative.dev/maxScale: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite doesn't support multiple writers
  selector:
    matchLabels:
      app: scoring-server
  template:
    metadata:
      labels:
        app: scoring-server
    spec:
      containers:
        - name: scoring-server
          image: openshift-registry.eu-at-3.icp.infineon.com/play-ahmd-test/scoring-server:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_PATH
              value: /data/tournament.db
            - name: CORS_ORIGIN
              value: "https://krish25ifx.github.io"
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: scoring-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-server
spec:
  selector:
    app: scoring-server
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: scoring-server
spec:
  to:
    kind: Service
    name: scoring-server
  port:
    targetPort: 3001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
